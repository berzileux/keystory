# Main nginx configuration for the keystory static site.
# Modelled on letter-duel/nginx.conf (same stack: a Vite static build served
# by nginxinc/nginx-unprivileged). Runs as a non-root user, so every writable
# path is under /tmp.

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Logs go to stdout and stderr so Cloud Logging picks them up.
    access_log /dev/stdout;

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    # Nothing is ever uploaded; this is a static site with no forms or APIs.
    client_max_body_size 1k;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # The corpus JSON is about 5 MB raw across 10 books; gzip is what keeps
    # that from being 5 MB over the wire on every first visit.
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    server {
        listen 8080 default_server;
        server_name _;

        root  /usr/share/nginx/html;
        index index.html;

        # Cloud Run terminates HTTPS and proxies plain HTTP to this
        # container; a redirect must never leak the internal port or become
        # absolute against the wrong scheme/host.
        absolute_redirect off;
        port_in_redirect off;

        # Security headers on every response this server emits directly
        # (the 405 below, and any location that does not set its own
        # add_header and so inherits these). Locations below that set their
        # own Cache-Control add_header re-include this file, because a
        # location with any add_header of its own drops server-level ones.
        include /etc/nginx/security-headers.conf;

        # Static site: no API, no forms. Keystory has no client-side router
        # (two views held in React state, not routes), so unlike a typical
        # SPA this never needs an index.html fallback for unknown paths.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        # Dotfiles (.git, .env, .well-known aside - not used here, Cloud Run
        # issues its own managed certificate) are never served, at any depth.
        location ~ /\. {
            return 404;
        }

        # Liveness/uptime probe target. Cloud Run does not use this itself
        # (it probes the container directly), but it is here for a human or
        # an external monitor to hit.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200;
        }

        # Vite's hashed build output (content in the filename) never changes
        # for a given URL, so it can be cached by the browser indefinitely.
        location /assets/ {
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # The shell page must always be revalidated so a new deploy is seen
        # on the next load, not cached past it. Handled as two locations
        # (the bare path and the literal filename) since both serve it.
        location = /index.html {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        location = / {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files /index.html =404;
        }

        # Corpus JSON is not content-hashed (passages-<book>.json, index.json
        # keep the same URL across a corpus update), so it must revalidate on
        # every load rather than being cached for any length of time. nginx's
        # default ETag (on by default for static files) makes that
        # revalidation a cheap 304, not a full re-download.
        location /corpus/ {
            add_header Cache-Control "no-cache" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Small, rarely-changed icons: cache for a day, not a year, since
        # they are not content-hashed either.
        location ~ ^/(favicon\.svg|apple-touch-icon\.png)$ {
            add_header Cache-Control "public, max-age=86400" always;
            include /etc/nginx/security-headers.conf;
            try_files $uri =404;
        }

        # Anything else: a real 404, never index.html (no SPA fallback).
        location / {
            try_files $uri $uri/ =404;
        }
    }
}
