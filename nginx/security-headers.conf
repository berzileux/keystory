# Security headers, included in every location that needs its own add_header
# (which otherwise drops any server-level add_header for that location - a
# known nginx trap) as well as at server level for every location that does
# not. Keeping this in one file means there is exactly one place to edit, and
# every location that includes it is guaranteed to match.
#
# CSP: this origin only, plus the Google Fonts stylesheet/font the app loads
# at runtime. 'unsafe-inline' in style-src is required because the heatmap
# and its stagger are rendered with inline style attributes (src/ui/Results.tsx,
# src/ui/styles.css's --hk variable), not a class-based approach.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# Redundant with frame-ancestors above for modern browsers; kept for older
# ones that do not read CSP, matching letter-duel's own nginx.conf.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# No includeSubDomains, no preload: Cloud Run terminates HTTPS itself and
# subdomain policy is SOUL's call to make later, not this phase's.
add_header Strict-Transport-Security "max-age=31536000" always;
